name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o JsAuctions_Android_Project.zip -d extracted
          find extracted -maxdepth 4 -type f | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Build APK
        run: |
          cd extracted/JsAuctions
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --stacktrace
          find . -type f -name "*.apk" -print

      - uses: actions/upload-artifact@v4
        with:
          name: JsAuctions-debug-apk
          path: extracted/**/*.apk
          if-no-files-found: error

