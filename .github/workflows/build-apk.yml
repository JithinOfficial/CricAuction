name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          rm -rf extracted
          unzip -o "JJ.zip" -d extracted
          find extracted -maxdepth 3 -type f | head -100

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate Gradle Project
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name gradlew | head -1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Gradle project found at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Enable AndroidX
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f gradle.properties ]; then
          touch gradle.properties
          fi

          grep -q "android.useAndroidX" gradle.properties || echo "android.useAndroidX=true" >> gradle.properties
          grep -q "android.enableJetifier" gradle.properties || echo "android.enableJetifier=true" >> gradle.properties

          cat gradle.properties

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Find APK
        run: |
          find extracted -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RDB-Auction-Manager-debug-apk
          path: extracted/**/*.apk
          if-no-files-found: error
