name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          unzip -o "JsAuctions_Premium_Polished_AIDE (1).zip" -d extracted
          find extracted -type f | head -100

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Build APK
        run: |
          cd extracted

          sed -i 's/jcenter()/google()\n        mavenCentral()/g' build.gradle

          wget https://services.gradle.org/distributions/gradle-6.7.1-bin.zip
          unzip gradle-6.7.1-bin.zip

          ./gradle-6.7.1/bin/gradle clean assembleDebug --stacktrace

      - name: Find APK
        run: |
          find extracted -name "*.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: JsAuctions-debug-apk
          path: extracted/**/*.apk
          if-no-files-found: error
