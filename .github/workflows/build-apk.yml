name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          rm -rf extracted
          unzip -o "JsAuctions_RDB_Intro_Theme.zip" -d extracted
          find extracted -type f | head -100

      - name: Setup Java 17 for SDK Manager
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK 30
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-30" "build-tools;30.0.3"

      - name: Setup Java 11 for Gradle Build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Build APK
        run: |
          cd extracted

          sed -i 's/jcenter()/google()\n        mavenCentral()/g' build.gradle

          wget https://services.gradle.org/distributions/gradle-6.7.1-bin.zip
          unzip -q gradle-6.7.1-bin.zip

          ./gradle-6.7.1/bin/gradle clean assembleDebug --stacktrace

      - name: Find APK
        run: |
          find extracted -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JsAuctionManager-debug-apk
          path: extracted/**/*.apk
          if-no-files-found: error
