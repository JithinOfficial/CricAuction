name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          unzip -o "JsAuctions_AuctionPro_AIDE(1).zip" -d extracted
          find extracted -type f | head -100

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Build APK
        run: |
          cd extracted
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: find extracted -name "*.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: JsAuctions-debug-apk
          path: extracted/**/*.apk
